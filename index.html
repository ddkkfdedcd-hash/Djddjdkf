<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MW2 - جیهانی هەلۆوین و سکینە تاریکەکان</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  body {
    background: radial-gradient(circle, #1a0505 0%, #050202 100%);
    color: #fca5a5;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
    padding: 20px;
  }

  .mw2-card {
    position: relative;
    width: min(100%, 450px);
    background: rgba(20, 5, 5, 0.85);
    backdrop-filter: blur(20px);
    border: 2px solid rgba(239, 68, 68, 0.3);
    border-radius: 30px;
    padding: 35px;
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9), 0 0 40px rgba(239, 68, 68, 0.2);
    text-align: center;
  }

  .mw2-logo {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: 3px;
    color: #ef4444;
    text-shadow: 0 0 15px rgba(239, 68, 68, 0.8);
    margin-bottom: 5px;
  }

  .subtitle {
    font-size: 13px;
    color: #991b1b;
    margin-bottom: 25px;
    letter-spacing: 1px;
    font-weight: bold;
  }

  .skins-grid {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 25px;
    text-align: right;
  }

  .skin-item {
    background: rgba(40, 10, 10, 0.6);
    border: 1px solid rgba(239, 68, 68, 0.2);
    padding: 14px 18px;
    border-radius: 14px;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .skin-item:hover {
    background: rgba(239, 68, 68, 0.25);
    border-color: #ef4444;
    transform: translateX(-5px);
  }

  .skin-name {
    font-size: 15px;
    font-weight: bold;
    color: #fee2e2;
  }

  .skin-tag {
    font-size: 12px;
    background: rgba(239, 68, 68, 0.2);
    color: #fca5a5;
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid rgba(239, 68, 68, 0.4);
  }

  .action-btn {
    background: linear-gradient(45deg, #b91c1c, #ef4444);
    border: none;
    color: white;
    padding: 14px 28px;
    font-size: 15px;
    font-weight: bold;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 10px 25px rgba(239, 68, 68, 0.4);
    transition: all 0.3s ease;
    width: 100%;
  }

  .action-btn:hover {
    transform: scale(1.03);
    box-shadow: 0 15px 35px rgba(239, 68, 68, 0.6);
  }

  .status-alert {
    margin-top: 20px;
    font-size: 14px;
    color: #f87171;
    font-weight: bold;
    min-height: 24px;
  }
</style>
</head>
<body>

<div class="mw2-card">
  <div class="mw2-logo">CALL OF DUTY: MW2</div>
  <div class="subtitle">🎃 تایبەتی هەلۆوین - ئۆپەراسیۆنی تاریکی 🎃</div>

  <div class="skins-grid">
    <div class="skin-item" onclick="selectSkin('سکیتی زۆمبی گۆست - Ghost')">
      <span class="skin-name">💀 Ghost - The Haunting</span>
      <span class="skin-tag">ئەستێرەی تاریکی</span>
    </div>

    <div class="skin-item" onclick="selectSkin('سکینی الخبیث - Al-Asad')">
      <span class="skin-name">🔥 Al-Asad - Netherworld</span>
      <span class="skin-tag">ئاگرین</span>
    </div>

    <div class="skin-item" onclick="selectSkin('سکینی پاتۆم - Valeria')">
      <span class="skin-name">🕷️ Valeria - Voodoo Queen</span>
      <span class="skin-tag">جەنگوڵی</span>
    </div>

    <div class="skin-item" onclick="selectSkin('سکینی سێبەر - Price')">
      <span class="skin-name">🌑 Captain Price - Phantom</span>
      <span class="skin-tag">سێبەری شەو</span>
    </div>
  </div>

  <button class="action-btn" onclick="activateHalloween()">🦇 چالاککردنی کات و کەشی هەلۆوین</button>

  <div class="status-alert" id="statusAlert">ئامادەیە بۆ جەنگ و پشکنین...</div>
</div>

<script>
  function selectSkin(skinName) {
    const alertBox = document.getElementById('statusAlert');
    alertBox.innerText = `⚡ سکینی هەڵبژێردراو: ${skinName} بار کرا!`;
  }

  function activateHalloween() {
    const alertBox = document.getElementById('statusAlert');
    alertBox.innerText = "🦇 فەزا و تاریکی هەلۆوین بە تەواوی لەسەر سەرتاسەری مەیدانی جەنگ سەپێنرا!";
  }
</script>

</body>
</html>
